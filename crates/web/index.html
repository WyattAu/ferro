<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Ferro — Self-Hosted File Sync Platform</title>
    <meta name="description" content="Ferro is a self-hosted file synchronization platform with WebDAV support, content-addressable storage, end-to-end encryption, and real-time collaboration. Open source, privacy-first."/>
    <meta name="robots" content="index, follow"/>
    <link rel="canonical" href="https://ferro.wyattau.com/"/>

    <!-- Open Graph -->
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Ferro — Self-Hosted File Sync Platform"/>
    <meta property="og:description" content="Self-hosted file synchronization with WebDAV, content-addressable storage, end-to-end encryption, and real-time collaboration."/>
    <meta property="og:url" content="https://ferro.wyattau.com/"/>
    <meta property="og:site_name" content="Ferro"/>
    <meta property="og:image" content="https://ferro.wyattau.com/ui/icon-512.png"/>

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Ferro — Self-Hosted File Sync Platform"/>
    <meta name="twitter:description" content="Self-hosted file synchronization with WebDAV, content-addressable storage, and end-to-end encryption."/>
    <meta name="twitter:image" content="https://ferro.wyattau.com/ui/icon-512.png"/>

    <!-- PWA -->
    <link rel="manifest" href="/ui/manifest.json">
    <meta name="theme-color" content="#E85D04">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/ui/style.css"/>
    <link data-trunk rel="copy-file" href="style.css"/>
    <link data-trunk-rel="rust" data-wasm-opt="O" data-bincode/>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ferro",
        "url": "https://ferro.wyattau.com",
        "description": "Self-hosted file synchronization platform with WebDAV, content-addressable storage, and end-to-end encryption.",
        "applicationCategory": "FileTransferApplication",
        "operatingSystem": "Web Browser",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "featureList": [
            "WebDAV file sync",
            "Content-addressable storage",
            "End-to-end encryption",
            "Real-time collaboration",
            "OIDC authentication",
            "WASM worker support"
        ]
    }
    </script>
</head>
<body>
    <main>
        <div id="app"></div>
    </main>
    <noscript>
        <div style="padding: 3rem; text-align: center; font-family: 'IBM Plex Mono', monospace; background: #F5F0EB; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid #2B2B2B;">
            <h1 style="font-size: 4rem; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 1rem;">Ferro</h1>
            <p style="font-family: 'Inter', sans-serif; color: #8B8178; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem;">WebAssembly is required to run this application.</p>
        </div>
    </noscript>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/ui/sw.js").catch(() => {});
            });
        }
    </script>
</body>
</html>
