[TV-RCLONE-001]
id = "TV-RCLONE-001"
method = "PROPFIND"
category = "rclone-compat"
description = "rclone-style PROPFIND with ownCloud checksum extension properties"
request_url = "/dav/files/"
request_headers = { Depth = "1" }
request_body = """<?xml version="1.0"?>
<d:propfind xmlns:d="DAV:" xmlns:oc="http://owncloud.org/ns" xmlns:nc="http://nextcloud.org/ns">
  <d:prop>
    <d:displayname/>
    <d:getlastmodified/>
    <d:getcontentlength/>
    <d:resourcetype/>
    <oc:checksums/>
    <oc:permissions/>
  </d:prop>
</d:propfind>"""
expected_status = 207
expected_response_body_contains = ["displayname", "getlastmodified", "getcontentlength", "resourcetype"]
preconditions = ["collection /dav/files/ exists with files"]
notes = "Server should return 404 for unknown properties in propstat; rclone ignores missing checksums gracefully"

