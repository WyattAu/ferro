[TV-OPTIONS-001]
id = "TV-OPTIONS-001"
method = "OPTIONS"
category = "nominal"
description = "OPTIONS returns correct DAV header and Allow header for WebDAV capability discovery"
request_url = "/dav/"
request_headers = {}
request_body = ""
expected_status = 200
expected_response_headers = { DAV = "1, 2", Allow = "GET, HEAD, PUT, DELETE, PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, LOCK, UNLOCK, OPTIONS" }
