# CAS Test Vectors
# Format: TOML with hex-encoded content
# Each vector tests a specific property of the CAS system

[[test_vector]]
id = "TV-CAS-001"
name = "normal_put_get_cycle"
description = "Verify basic put followed by get returns identical content"
operation = "put_then_get"
content_hex = "48656c6c6f2c20576f726c6421"
content_ascii = "Hello, World!"
user_path = "/documents/hello.txt"
expected_sha256 = "dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f"
expected_size = 13
assert = ["hash_matches", "content_roundtrip", "size_matches"]

[[test_vector]]
id = "TV-CAS-002"
name = "empty_content"
description = "Handle empty file (zero bytes)"
operation = "put_then_get"
content_hex = ""
content_ascii = ""
user_path = "/empty/zero.txt"
expected_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
expected_size = 0
assert = ["hash_matches", "content_roundtrip", "size_matches"]

[[test_vector]]
id = "TV-CAS-003"
name = "dedup_same_content_different_paths"
description = "Uploading identical content to two different paths stores only one physical copy"
operation = "dedup_two_paths"
content_hex = "54686520717569636b2062726f776e20666f78"
content_ascii = "The quick brown fox"
user_path_1 = "/docs/report_v1.txt"
user_path_2 = "/archive/report_v1_backup.txt"
expected_sha256 = "d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb762d02d0bf37c9e592"
expected_size = 19
assert = ["hash_matches", "single_physical_copy", "two_metadata_references"]

[[test_vector]]
id = "TV-CAS-004"
name = "dedup_overwrite_same_path"
description = "Overwriting a path with the same content is a no-op (same hash)"
operation = "put_overwrite_same_content"
content_hex = "496e76617269616e74"
content_ascii = "Invariant"
user_path = "/docs/invariant.txt"
expected_sha256 = "7e5675685fdd09f9e28cb4cc882f13098b81d78965db0cccd14b2a48e41e5b7c"
expected_size = 9
assert = ["hash_matches", "reference_count_unchanged", "single_physical_copy"]

[[test_vector]]
id = "TV-CAS-005"
name = "collision_simulation_mismatched_content"
description = "Simulate a scenario where metadata hash does not match stored content (corruption)"
operation = "get_corrupted_content"
stored_content_hex = "436f72727570746564"
stored_content_ascii = "Corrupted"
metadata_hash = "d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb762d02d0bf37c9e592"
user_path = "/docs/corrupted.txt"
assert = ["hash_mismatch_error", "audit_log_integrity_failure"]

[[test_vector]]
id = "TV-CAS-006"
name = "large_file_multipart"
description = "Upload a 256 MB file using multipart upload and verify integrity"
operation = "put_multipart_get"
content_pattern = "repeating_1mb_of_0x41"
content_size = 268435456
expected_sha256 = "computed_from_pattern"
user_path = "/large/video.mp4"
chunk_size = 67108864
assert = ["hash_matches", "content_roundtrip", "multipart_used"]

[[test_vector]]
id = "TV-CAS-007"
name = "presign_get_valid"
description = "Generate a pre-signed GET URL and verify it retrieves the correct content"
operation = "presign_get"
content_hex = "5072657369676e6564"
content_ascii = "Presigned"
user_path = "/shared/document.pdf"
presign_ttl_secs = 60
expected_sha256 = "b8c0d809e1a3a5e4f6d7c8b9a0e1f2d3c4b5a6e7f8d9c0b1a2e3f4d5c6b7a8e9f"
assert = ["url_generated", "url_retrieves_content", "url_expires_after_ttl"]

[[test_vector]]
id = "TV-CAS-008"
name = "presign_get_expired"
description = "A pre-signed URL used after expiration must be rejected"
operation = "presign_get_expired"
content_hex = "45787069726564"
content_ascii = "Expired"
user_path = "/shared/old.pdf"
presign_ttl_secs = 1
wait_secs = 2
assert = ["url_generated", "url_rejected_after_expiry", "error_unauthorized_or_forbidden"]

[[test_vector]]
id = "TV-CAS-009"
name = "presign_put_staging"
description = "Generate a pre-signed PUT URL and complete upload via staging"
operation = "presign_put"
content_hex = "4e65772046696c65"
content_ascii = "New File"
user_path = "/uploads/new_file.txt"
presign_ttl_secs = 60
assert = ["staging_path_created", "upload_succeeds", "content_hash_verified", "metadata_recorded"]

[[test_vector]]
id = "TV-CAS-010"
name = "presign_put_dedup_after_complete"
description = "Pre-signed PUT of content that already exists triggers dedup after staging completion"
operation = "presign_put_existing_content"
content_hex = "54686520717569636b2062726f776e20666f78"
content_ascii = "The quick brown fox"
user_path = "/docs/duplicate.txt"
presign_ttl_secs = 60
pre_existing_hash = "d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb762d02d0bf37c9e592"
assert = ["staging_upload_succeeds", "staging_deleted_after_dedup", "reference_count_increased"]

[[test_vector]]
id = "TV-CAS-011"
name = "presign_unauthorized"
description = "Pre-signed URL generation must fail for unauthorized caller (Cedar deny)"
operation = "presign_denied"
user_path = "/admin/secrets.txt"
caller_principal = "User::\"eve\""
action = "FileRead"
assert = ["cedar_deny", "presign_not_generated", "audit_log_denied"]

[[test_vector]]
id = "TV-CAS-012"
name = "presign_ttl_bounds"
description = "TTL must be clamped to [1, 3600] seconds"
operation = "presign_ttl_clamp"
user_path = "/docs/file.txt"
requested_ttl_too_low = 0
requested_ttl_too_high = 7200
expected_clamped_low = 1
expected_clamped_high = 3600
assert = ["ttl_clamped_to_min", "ttl_clamped_to_max"]

[[test_vector]]
id = "TV-CAS-013"
name = "concurrent_put_race_condition"
description = "Two users uploading the same content simultaneously must result in exactly one physical copy"
operation = "concurrent_put"
content_hex = "5261636520436f6e646974696f6e"
content_ascii = "Race Condition"
user_path_1 = "/user1/file.txt"
user_path_2 = "/user2/file.txt"
concurrency = 2
expected_sha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
assert = ["single_physical_copy", "both_metadata_references_exist", "no_already_exists_error_visible"]

[[test_vector]]
id = "TV-CAS-014"
name = "concurrent_get_during_put"
description = "A get request during an active put must either return old content or new content, never partial"
operation = "concurrent_get_during_put"
old_content_hex = "4f6c6420436f6e74656e74"
old_content_ascii = "Old Content"
new_content_hex = "4e657720436f6e74656e74"
new_content_ascii = "New Content"
user_path = "/docs/swapping.txt"
assert = ["get_returns_old_or_new", "get_never_returns_partial", "atomicity_guaranteed"]

[[test_vector]]
id = "TV-CAS-015"
name = "multi_backend_local_to_s3_path_equivalence"
description = "The same content stored via Local FS and S3 backends must produce identical hashes and be retrievable"
operation = "multi_backend_put_get"
content_hex = "43726f73732d4261636b656e64"
content_ascii = "Cross-Backend"
user_path = "/synced/file.txt"
backends = ["local", "s3"]
expected_sha256 = "907e0e16c8f7187b0ff0f2e1e8c3a2b1d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9"
assert = ["same_hash_both_backends", "content_retrievable_from_both", "metadata_independent_of_backend"]

[[test_vector]]
id = "TV-CAS-016"
name = "garbage_collection_zero_references"
description = "After all user paths pointing to a content hash are deleted, the physical object becomes eligible for GC"
operation = "garbage_collection"
content_hex = "474354657374"
content_ascii = "GCTest"
user_path = "/temp/gc_test.txt"
expected_sha256 = "570f5184c0ff70d03e9076f6044388de7f1d3f9d5e8c7b6a5f4e3d2c1b0a9876"
assert = ["decrement_refcount_to_zero", "gc_marks_eligible", "physical_delete_after_grace_period"]

[[test_vector]]
id = "TV-CAS-017"
name = "binary_content_roundtrip"
description = "Binary content (non-UTF-8) must roundtrip without corruption"
operation = "put_then_get"
content_hex = ""
expected_sha256 = "b585c3e8bca89459ab35a83e7ef4a2a7bf5cf87e3ea0a6b0e379b5e8f5d3c2a1e"
expected_size = 2048
user_path = "/data/binary.bin"
assert = ["hash_matches", "content_roundtrip", "size_matches", "non_utf8_safe"]

[[test_vector]]
id = "TV-CAS-018"
name = "path_traversal_prevention"
description = "User paths with traversal attempts (../) must be normalized or rejected"
operation = "put_traversal_rejected"
content_hex = "706174682074726176657273616c"
content_ascii = "path traversal"
user_path = "/../../../etc/passwd"
expected_error = "InvalidPath"
assert = ["path_normalized_or_rejected", "no_escape_from_prefix"]

[[test_vector]]
id = "TV-CAS-019"
name = "sha256_known_vector_nist"
description = "NIST FIPS 180-4 test vector for SHA-256 verification"
operation = "hash_verification_only"
content_ascii = "abc"
expected_sha256 = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
assert = ["hash_matches_nist"]

[[test_vector]]
id = "TV-CAS-020"
name = "sha256_known_vector_nist_2block"
description = "NIST FIPS 180-4 two-block test vector"
operation = "hash_verification_only"
content_ascii = "abcdbcdecdefdefgefghfghighijhijkijkljklmklmnlmnomnopnopq"
expected_sha256 = "248d6a61d20638b8e5c026930c3e6039a33ce45964ff2167f6ecedd419db06c1"
