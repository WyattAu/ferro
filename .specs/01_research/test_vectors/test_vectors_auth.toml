[TV-CEDAR-007]
id = "TV-CEDAR-007"
category = "cedar"
subcategory = "nominal"
description = "Policy with attribute-based conditions evaluates correctly"
policies = """
permit(
    principal is User,
    action == Action::"view",
    resource is File
)
when {
    resource.owner == principal &&
    principal.department == "engineering" &&
    principal.jobLevel >= 5
};
"""
request_principal = """User::"bob""""
request_action = """Action::"view""""
request_resource = """File::"design.spec""""
request_context = "{}"
entities = """[
  {
    "uid": "User::\"bob\"",
    "type": "User",
    "attrs": {"department": "engineering", "jobLevel": 7}
  },
  {
    "uid": "File::\"design.spec\"",
    "type": "File",
    "attrs": {"owner": {"__cedar_entity": "User::\"bob\""}}
  }
]"""
expected_decision = "Allow"
expected_determining_policies = 1
notes = "All three conditions in when clause evaluate to true"

[TV-CEDAR-008]
id = "TV-CEDAR-008"
category = "cedar"
subcategory = "nominal"
