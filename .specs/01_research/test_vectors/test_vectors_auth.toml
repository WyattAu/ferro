# ============================================================
# OIDC Token Validation — Nominal
# ============================================================

[TV-OIDC-001]
id = "TV-OIDC-001"
category = "oidc"
subcategory = "nominal"
description = "Valid ID Token with all required claims passes validation"
token_header = """{"alg": "RS256", "typ": "JWT", "kid": "key-1"}"""
token_payload = """{
  "iss": "https://auth.ferro.local",
  "sub": "a1b2c3d4-e5f6-a1b2-c3d4-EXAMPLE00001",
  "aud": "ferro-client",
  "exp": 9999999999,
  "iat": 1713400000,
  "nonce": "n0nc3-s3cur3-v4lu3"
}"""
signature = "valid_rs256_signature_with_key_1"
jwks_kid = "key-1"
jwks_alg = "RS256"
expected_issuer = "https://auth.ferro.local"
expected_audience = "ferro-client"
expected_nonce = "n0nc3-s3cur3-v4lu3"
expected_result = "Valid"
expected_principal_uid = """User::"a1b2c3d4-e5f6-a1b2-c3d4-EXAMPLE00001""""
notes = "Happy path: all required claims present, signature valid, all checks pass"

