[TV-CEDAR-009]
id = "TV-CEDAR-009"
category = "cedar"
subcategory = "nominal"
description = "Context-based authorization using request context (IP address, MFA status)"
policies = """
forbid(
    principal,
    action,
    resource
)
unless {
    context.authentication.mfa == true
};

permit(
    principal is User,
    action in [Action::"view", Action::"edit"],
    resource is File
)
when {
    context.network.ip matches "^10\\.0\\..*"
};
"""
request_principal = """User::"alice""""
request_action = """Action::"edit""""
request_resource = """File::"doc.pdf""""
request_context = """{"authentication": {"mfa": true}, "network": {"ip": "10.0.1.50"}}"""
entities = """[
  {"uid": "User::\"alice\"", "type": "User", "attrs": {}},
  {"uid": "File::\"doc.pdf\"", "type": "File", "attrs": {}}
]"""
expected_decision = "Allow"
expected_determining_policies = 1
notes = "MFA is true (unless fails -> forbid not triggered); IP matches 10.0.* (permit triggered)"

