[TV-CEDAR-005]
id = "TV-CEDAR-005"
category = "cedar"
subcategory = "boundary"
description = "Permit and forbid both match on same request -> Deny (forbid overrides)"
policies = """
permit(
    principal == User::"alice",
    action == Action::"view",
    resource == File::"secret.pdf"
);

forbid(
    principal,
    action == Action::"view",
    resource
)
when {
    resource.confidential == true
};
"""
request_principal = """User::"alice""""
request_action = """Action::"view""""
request_resource = """File::"secret.pdf""""
request_context = "{}"
entities = """[
  {
    "uid": "File::\"secret.pdf\"",
    "type": "File",
    "attrs": {"confidential": true}
  }
]"""
expected_decision = "Deny"
expected_determining_policies = 1
determining_policy_effect = "forbid"
notes = "Both permit and forbid match; forbid takes precedence per Cedar semantics"

