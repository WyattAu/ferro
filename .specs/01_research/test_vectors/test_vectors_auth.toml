[TV-CEDAR-001]
id = "TV-CEDAR-001"
category = "cedar"
subcategory = "nominal"
description = "Permit policy matches request exactly -> Allow"
policies = """
permit(
    principal == User::"alice",
    action == Action::"view",
    resource == File::"doc.pdf"
);
"""
request_principal = """User::"alice""""
request_action = """Action::"view""""
request_resource = """File::"doc.pdf""""
request_context = "{}"
entities = "{}"
expected_decision = "Allow"
expected_determining_policies = 1
notes = "Exact match on all three scope constraints"

