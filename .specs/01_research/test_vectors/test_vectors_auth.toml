[TV-OIDC-007]
id = "TV-OIDC-007"
category = "oidc"
subcategory = "adversarial"
description = "Token with alg=none is rejected (algorithm substitution attack)"
token_header = """{"alg": "none", "typ": "JWT"}"""
token_payload = """{
  "iss": "https://auth.ferro.local",
  "sub": "attacker-controlled-subject",
  "aud": "ferro-client",
  "exp": 9999999999,
  "iat": 1713400000
}"""
signature = ""
jwks_kid = "key-1"
jwks_alg = "RS256"
expected_issuer = "https://auth.ferro.local"
expected_audience = "ferro-client"
expected_nonce = "n0nc3-s3cur3-v4lu3"
expected_result = "Rejected"
expected_error = "AlgorithmNotAllowed"
notes = "CVE-2016-10555 class attack: alg=none bypasses signature verification. MUST be rejected unconditionally."

